<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>وحدة تحويل الصوت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #12181f;
      --panel-raised: #1a222c;
      --steel: #2a3540;
      --text: #e8edf2;
      --text-dim: #6b7684;
      --lcd-green: #4ade80;
      --lcd-glow: rgba(74, 222, 128, 0.35);
      --amber: #ffb020;
      --stop-red: #ff4d4f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at top, #131a22 0%, var(--bg) 60%);
      font-family: 'IBM Plex Sans Arabic', Arial, sans-serif;
      color: var(--text);
      padding: 24px 16px;
    }

    .console {
      width: 100%;
      max-width: 380px;
      background: var(--panel);
      border: 1px solid var(--steel);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .title {
      font-size: 17px;
      font-weight: 700;
      margin: 2px 0 0;
    }

    .conn-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .conn-dot.live {
      background: var(--stop-red);
      box-shadow: 0 0 10px rgba(255, 77, 79, 0.5);
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .lcd {
      background: #05130a;
      border: 1px solid #163823;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 18px;
      font-family: 'JetBrains Mono', monospace;
      min-height: 90px;
      position: relative;
      overflow: hidden;
    }

    .lcd::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg,
          rgba(74, 222, 128, 0.03) 0px,
          rgba(74, 222, 128, 0.03) 1px,
          transparent 1px,
          transparent 3px);
      pointer-events: none;
    }

    .lcd-label {
      color: #2f8a54;
      font-size: 11px;
      margin-bottom: 6px;
    }

    .lcd-text {
      color: var(--lcd-green);
      font-size: 14px;
      line-height: 1.6;
      text-shadow: 0 0 6px var(--lcd-glow);
      word-break: break-word;
    }

    .lcd-text.placeholder {
      color: #2f8a54;
    }

    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 56px;
      margin-bottom: 18px;
    }

    .bar {
      width: 5px;
      height: 8px;
      background: var(--steel);
      border-radius: 3px;
      transition: height 0.15s ease, background 0.15s ease;
    }

    .bar.active {
      background: var(--lcd-green);
      box-shadow: 0 0 6px var(--lcd-glow);
    }

    .mic-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 2px solid var(--steel);
      background: linear-gradient(180deg, var(--panel-raised), #141b23);
      box-shadow: 0 4px 0 var(--steel), 0 6px 14px rgba(0, 0, 0, 0.4);
      color: var(--text);
      font-size: 30px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, border-color 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .mic-btn.recording {
      border-color: var(--stop-red);
      color: var(--stop-red);
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--steel), 0 2px 8px rgba(255, 77, 79, 0.35);
    }

    .mic-hint {
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 18px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--steel);
      background: var(--panel-raised);
      color: var(--text);
      font-family: 'IBM Plex Sans Arabic', Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .action-btn.save {
      background: var(--lcd-green);
      color: #05130a;
      border-color: var(--lcd-green);
    }

    .action-btn:active {
      transform: translateY(2px);
    }

    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="console">
    <div class="console-header">
      <div>
        <div class="eyebrow">VOICE INPUT UNIT</div>
        <div class="title">وحدة تحويل الصوت لنص</div>
      </div>
      <div class="conn-dot" id="recDot"></div>
    </div>

    <div class="lcd">
      <div class="lcd-label">TRANSCRIPT</div>
      <div class="lcd-text placeholder" id="transcriptText">اضغط المايك وابدأ الكلام...</div>
    </div>

    <div class="waveform" id="waveform">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <button class="mic-btn" id="micBtn" aria-label="تسجيل صوتي">🎤</button>
    <div class="mic-hint" id="micHint">اضغط للبدء بالتسجيل</div>

    <div class="actions">
      <button class="action-btn" id="clearBtn">مسح</button>
      <button class="action-btn save" id="saveBtn" disabled>حفظ النص</button>
    </div>

    <a href="/" class="back-link">← الرجوع للوحة تحكم الروبوت</a>
  </div>

  <script>
    const micBtn = document.getElementById('micBtn');
    const micHint = document.getElementById('micHint');
    const transcriptEl = document.getElementById('transcriptText');
    const recDot = document.getElementById('recDot');
    const saveBtn = document.getElementById('saveBtn');
    const clearBtn = document.getElementById('clearBtn');
    const bars = document.querySelectorAll('.bar');

    let finalText = '';
    let waveInterval = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      transcriptEl.textContent = 'المتصفح لا يدعم تحويل الصوت. جرب Chrome.';
      micBtn.disabled = true;
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';
      recognition.continuous = true;
      recognition.interimResults = true;

      let isRecording = false;

      function animateWave() {
        bars.forEach(bar => {
          const h = Math.floor(Math.random() * 40) + 8;
          bar.style.height = h + 'px';
          bar.classList.add('active');
        });
      }

      function resetWave() {
        bars.forEach(bar => {
          bar.style.height = '8px';
          bar.classList.remove('active');
        });
      }

      micBtn.addEventListener('click', () => {
        if (!isRecording) {
          finalText = '';
          recognition.start();
        } else {
          recognition.stop();
        }
      });

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        micHint.textContent = 'جاري الاستماع... اضغط للإيقاف';
        recDot.classList.add('live');
        transcriptEl.classList.remove('placeholder');
        waveInterval = setInterval(animateWave, 150);
      };

      recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
        micHint.textContent = 'اضغط للبدء بالتسجيل';
        recDot.classList.remove('live');
        clearInterval(waveInterval);
        resetWave();
      };

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalText += transcript + ' ';
          } else {
            interim += transcript;
          }
        }
        const displayText = (finalText + interim).trim();
        transcriptEl.textContent = displayText || 'اضغط المايك وابدأ الكلام...';
        saveBtn.disabled = finalText.trim().length === 0;
      };

      recognition.onerror = (event) => {
        micHint.textContent = 'خطأ: ' + event.error;
      };
    }

    clearBtn.addEventListener('click', () => {
      finalText = '';
      transcriptEl.textContent = 'اضغط المايك وابدأ الكلام...';
      transcriptEl.classList.add('placeholder');
      saveBtn.disabled = true;
    });

    saveBtn.addEventListener('click', () => {
      const textToSave = finalText.trim();
      if (!textToSave) return;

      saveBtn.disabled = true;
      saveBtn.textContent = 'جاري الحفظ...';

      fetch('/save_voice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'text=' + encodeURIComponent(textToSave)
      })
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            micHint.textContent = 'تم الحفظ بنجاح ✓';
          } else {
            micHint.textContent = 'خطأ: ' + data.message;
          }
          saveBtn.textContent = 'حفظ النص';
        })
        .catch(() => {
          micHint.textContent = 'تعذر الاتصال بالسيرفر';
          saveBtn.textContent = 'حفظ النص';
          saveBtn.disabled = false;
        });
    });
  </script>

</body>

</html>
